# WEARME — Body parameters configuration

# Gender options
gender:
  allowed: ["neutral", "male", "female"]
  default: "neutral"

# Approximate height (metres) — indicative, derived from SMPL vertices
height:
  min: 1.40
  max: 2.20
  default: 1.75
  unit: m

# Approximate weight (kg) — indicative slider only
weight:
  min: 40.0
  max: 200.0
  default: 70.0
  unit: kg

# SMPL shape coefficients (beta vector, 10 dims)
# Range is roughly ±4 standard deviations from the training distribution
betas:
  dims: 10
  min: -4.0
  max: 4.0
  default: 0.0

# SMPL pose parameters (theta vector, 72 dims = 24 joints × 3 Rodrigues)
# Phase 1: always T-pose (all zeros); Phase 2+ will expose joint controls
pose:
  dims: 72
  default: 0.0

# Translation vector (metres, world space)
trans:
  dims: 3
  default: 0.0
